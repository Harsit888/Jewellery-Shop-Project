<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxe Admin Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
    .login-card h2 { color: #d4af37; margin-bottom: 8px; font-size: 28px; }
    .login-card p { color: #666; font-size: 14px; margin-bottom: 24px; }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; font-size: 12px; font-weight: bold; color: #333; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
    .input-group input:focus { border-color: #d4af37; }
    .login-btn { width: 100%; padding: 12px; background: #d4af37; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; transition: 0.3s; }
    .login-btn:hover { background: #b89628; }
    .error-msg { color: #d9534f; font-size: 13px; margin-top: 15px; display: none; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Luxe Admin</h2>
    <p>Please enter your credentials to access portal</p>
    
    <form onsubmit="handleLogin(event)">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" required autocomplete="off">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="login-btn">Login to Portal</button>
      <div id="error-message" class="error-msg">Invalid Username or Password!</div>
    </form>
  </div>

  <script src="login-script.js"></script>
</body>
</html>
